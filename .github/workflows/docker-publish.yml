name: 构建并推送镜像（GHCR）

# 推送到 main / custom 分支或打 v* 标签时自动构建多架构镜像并推送；
# 也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main, custom]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '覆盖镜像标签（留空则按分支/标签自动生成）'
        required: false
        default: ''
      platforms:
        description: '目标平台'
        required: true
        type: choice
        default: 'linux/amd64,linux/arm64'
        options:
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64'
          - 'linux/arm64'
      push:
        description: '构建后推送镜像（取消勾选则只验证能否构建）'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 amd64 / arm64 镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 设置 QEMU（跨架构构建）
        uses: docker/setup-qemu-action@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR 使用仓库自带的 GITHUB_TOKEN 即可，无需额外配置密钥，
      # 但仓库 Settings → Actions → General → Workflow permissions 需为「Read and write permissions」。
      - name: 登录 GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像地址与标签
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          # GHCR 镜像路径必须全小写
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/web-renamer"
          tags=("${image}:sha-${SHA:0:7}")
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            tags+=("${image}:${INPUT_TAG}")
          elif [ "$REF" = "refs/heads/main" ]; then
            tags+=("${image}:latest")
          elif [ -n "$REF_NAME" ]; then
            tags+=("${image}:${REF_NAME}")
          fi
          {
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Web ReNamer
            org.opencontainers.image.description=自托管 Docker 版文件批量重命名工具（ReNamer 替代，含递归添加目录）
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: 写入任务摘要
        run: |
          {
            echo "### 镜像构建完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 镜像地址 | \`${{ steps.image.outputs.image }}\` |"
            echo "| 标签 | \`${{ github.ref_name }}\` / \`sha-${{ github.sha }}\` |"
            echo "| 平台 | \`${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}\` |"
            echo "| 已推送 | ${{ github.event_name != 'pull_request' && (github.event.inputs.push != 'false') }} |"
            echo ""
            echo "首次构建后，请到仓库 **Packages** 页面把 `web-renamer` 包的可见性改为 **Public**（或 NAS 上 \`docker login ghcr.io\`），然后更新 NAS 上的 compose 镜像地址。"
          } >> "$GITHUB_STEP_SUMMARY"
